# Repository-specific: runs the test suite on a visionOS simulator, the package's main platform.
# (ci.yml runs the same tests on macOS and on an iPhone simulator.)
name: visionOS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: visionos-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: xcodebuild test (visionOS simulator)
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Test
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("xrOS|visionOS")) | .value[]] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No available visionOS simulator on this image"
            exit 1
          fi
          xcodebuild test -scheme VisionUI -destination "id=$udid" \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO -quiet
