# XcodeGen spec for SpatialGallery.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: SpatialGallery
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    visionOS: "2.0"
    iOS: "18.0"
    macOS: "15.0"
packages:
  VisionUI:
    path: ../..
targets:
  SpatialGallery:
    type: application
    supportedDestinations: [visionOS, iOS, macOS]
    sources: [SpatialGallery]
    dependencies:
      - package: VisionUI
        product: VisionUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spatial Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # visionOS: several windows (the gallery and the volume) and an immersive space.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2,7"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulators need no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  SpatialGallery:
    build:
      targets:
        SpatialGallery: all
    run:
      config: Debug
